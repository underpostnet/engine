name: CI | Mirror to organization
# The organization publishes only the owner-scoped packages, so only their ghpkg repositories are
# mirrored. Each producer dispatches this workflow after its own push succeeds, so a mirror never
# copies a state whose build has not finished.
on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'Space-separated repository names to mirror (default: vars.MIRROR_REPOS)'
        required: false
        default: ''
permissions:
  contents: read
# One run at a time per repository set: concurrent force-syncs of one repository could land out of
# order, and a single group would cancel a dispatch queued behind another producer's.
concurrency:
  group: mirror-to-org-${{ github.event.inputs.repos || github.event_name }}
  cancel-in-progress: false
jobs:
  gate:
    if: github.repository == 'underpostnet/engine' || github.repository == 'underpost/engine'
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.plan.outputs.repos }}
    steps:
      - name: Resolve the repositories to mirror
        id: plan
        env:
          REQUESTED: ${{ github.event.inputs.repos }}
          DEFAULT_REPOS: ${{ vars.MIRROR_REPOS || 'pwa-microservices-template-ghpkg engine-ghpkg-cyberia' }}
        run: |
          set -euo pipefail -f
          repos=()
          for repo in ${REQUESTED:-$DEFAULT_REPOS}; do
            if ! [[ "$repo" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::'$repo' is not a repository name."
              exit 1
            fi
            repos+=("$repo")
          done
          echo "repos=$(printf '%s\n' "${repos[@]}" | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  mirror:
    needs: gate
    if: needs.gate.outputs.repos != '' && needs.gate.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.gate.outputs.repos) }}
    env:
      SOURCE_OWNER: ${{ github.repository_owner }}
      MIRROR_ORG: ${{ vars.MIRROR_ORG || 'underpost' }}
      MIRROR_REPO: ${{ matrix.repo }}
      # MIRROR_TOKEN: a PAT with contents and workflow write on the organization repositories and
      # read on the sources. GIT_AUTH_TOKEN stands in where one credential covers both accounts.
      GH_TOKEN: ${{ secrets.MIRROR_TOKEN || secrets.GIT_AUTH_TOKEN }}
    steps:
      - name: Force-sync every branch and tag
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::No MIRROR_TOKEN or GIT_AUTH_TOKEN secret."
            exit 1
          fi
          if ! gh api "repos/$MIRROR_ORG/$MIRROR_REPO" --silent; then
            echo "::notice::$MIRROR_ORG/$MIRROR_REPO does not exist or is not reachable; nothing mirrored."
            exit 0
          fi
          # gh serves the credential to git from GH_TOKEN, so it never enters a URL or git config.
          gh auth setup-git
          git clone --mirror --quiet "https://github.com/$SOURCE_OWNER/$MIRROR_REPO.git" source.git
          git -C source.git push --force --prune "https://github.com/$MIRROR_ORG/$MIRROR_REPO.git" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
          echo "::notice::$SOURCE_OWNER/$MIRROR_REPO mirrored to $MIRROR_ORG/$MIRROR_REPO"
