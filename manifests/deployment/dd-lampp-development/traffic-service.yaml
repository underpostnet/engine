---
apiVersion: v1
kind: Service
metadata:
  name: dd-lampp-development-traffic-service
  namespace: underpost-workloads
  labels:
    underpost.net/traffic-service: "true"
    underpost.net/deploy-id: dd-lampp-development
spec:
  type: ClusterIP
  selector:
    app: dd-lampp-development-blue
  ports:
    - name: 'tcp-4033'
      protocol: TCP
      port: 4033
      targetPort: 4033
    - name: 'udp-4033'
      protocol: UDP
      port: 4033
      targetPort: 4033

    - name: 'tcp-4034'
      protocol: TCP
      port: 4034
      targetPort: 4034
    - name: 'udp-4034'
      protocol: UDP
      port: 4034
      targetPort: 4034

    - name: 'tcp-4035'
      protocol: TCP
      port: 4035
      targetPort: 4035
    - name: 'udp-4035'
      protocol: UDP
      port: 4035
      targetPort: 4035

    - name: 'tcp-4036'
      protocol: TCP
      port: 4036
      targetPort: 4036
    - name: 'udp-4036'
      protocol: UDP
      port: 4036
      targetPort: 4036
