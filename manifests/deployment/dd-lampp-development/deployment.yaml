---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-lampp-development-blue
  namespace: underpost-workloads
  labels:
    app: dd-lampp-development-blue
    deploy-id: dd-lampp-development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dd-lampp-development-blue
  template:
    metadata:
      labels:
        app: dd-lampp-development-blue
        deploy-id: dd-lampp-development
    spec:
      containers:
        - name: dd-lampp-development-blue
          image: underpost/underpost-engine:v4.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: underpost-config
            # The deployment's own environment, with its .env.<env>.oci overlay already
            # applied by 'app apply'. Optional so a deployment predating that Secret still
            # starts; the in-pod 'app load' resolves the same overlay as a second path.
            - secretRef:
                name: dd-lampp-development-env
                optional: true
          env:
            - name: UNDERPOST_INTERNAL_PORT
              value: "4032"

          command:
            - /bin/sh
            - -c
            - >
              underpost start --build --run dd-lampp development
          readinessProbe:
            {
              "httpGet": {
                "path": "/_internal/ready",
                "port": 4032
              },
              "initialDelaySeconds": 5,
              "periodSeconds": 5,
              "timeoutSeconds": 3,
              "failureThreshold": 3
            }
          livenessProbe:
            {
              "httpGet": {
                "path": "/_internal/health",
                "port": 4032
              },
              "initialDelaySeconds": 30,
              "periodSeconds": 15,
              "timeoutSeconds": 3,
              "failureThreshold": 3
            }
          startupProbe:
            {
              "httpGet": {
                "path": "/_internal/ready",
                "port": 4032
              },
              "initialDelaySeconds": 10,
              "periodSeconds": 10,
              "timeoutSeconds": 3,
              "failureThreshold": 180
            }



---
apiVersion: v1
kind: Service
metadata:
  name: dd-lampp-development-blue-service
  namespace: underpost-workloads
spec:
  selector:
    app: dd-lampp-development-blue
  ports:
    - name: 'tcp-4033'
      protocol: TCP
      port: 4033
      targetPort: 4033
    - name: 'udp-4033'
      protocol: UDP
      port: 4033
      targetPort: 4033

    - name: 'tcp-4034'
      protocol: TCP
      port: 4034
      targetPort: 4034
    - name: 'udp-4034'
      protocol: UDP
      port: 4034
      targetPort: 4034

    - name: 'tcp-4035'
      protocol: TCP
      port: 4035
      targetPort: 4035
    - name: 'udp-4035'
      protocol: UDP
      port: 4035
      targetPort: 4035

    - name: 'tcp-4036'
      protocol: TCP
      port: 4036
      targetPort: 4036
    - name: 'udp-4036'
      protocol: UDP
      port: 4036
      targetPort: 4036
  type: LoadBalancer
