
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: www.giancarlobertini.com
  namespace: underpost-workloads
spec:
  virtualhost:
    fqdn: www.giancarlobertini.com
    tls:
      secretName: www.giancarlobertini.com
  routes:
    - conditions:
        - prefix: /
      
      enableWebsockets: true
      services:
        - name: dd-lampp-development-traffic-service
          port: 4033
          weight: 100
    
