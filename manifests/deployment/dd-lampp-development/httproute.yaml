
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www.giancarlobertini.com
  namespace: underpost-workloads
  labels:
    app.kubernetes.io/managed-by: underpost
    deploy-id: dd-lampp-development
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: dd-lampp-development
      namespace: underpost-workloads
  hostnames:
    - www.giancarlobertini.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Alt-Svc
                value: 'h3=":443"; ma=86400'
      backendRefs:
        - name: dd-lampp-development-traffic-service
          port: 4033
          weight: 100

