
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dd-core-development
  namespace: underpost-workloads
  labels:
    app.kubernetes.io/managed-by: underpost
    deploy-id: dd-core-development
spec:
  gatewayClassName: eg
  listeners:
    - name: http-dogmadual-com-85c5f221
      hostname: "dogmadual.com"
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-dogmadual-com-85c5f221
      hostname: "dogmadual.com"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: dogmadual.com
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-nexodev-org-6b8e2bac
      hostname: "nexodev.org"
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-nexodev-org-6b8e2bac
      hostname: "nexodev.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: nexodev.org
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-www-dogmadual-com-427ae6e8
      hostname: "www.dogmadual.com"
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-www-dogmadual-com-427ae6e8
      hostname: "www.dogmadual.com"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: www.dogmadual.com
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-www-nexodev-org-f922ef31
      hostname: "www.nexodev.org"
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-www-nexodev-org-f922ef31
      hostname: "www.nexodev.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: www.nexodev.org
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: dd-core-development-http3
  namespace: underpost-workloads
  labels:
    app.kubernetes.io/managed-by: underpost
    deploy-id: dd-core-development
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: dd-core-development
      sectionName: https-dogmadual-com-85c5f221
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: dd-core-development
      sectionName: https-nexodev-org-6b8e2bac
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: dd-core-development
      sectionName: https-www-dogmadual-com-427ae6e8
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: dd-core-development
      sectionName: https-www-nexodev-org-f922ef31
  http3: {}
