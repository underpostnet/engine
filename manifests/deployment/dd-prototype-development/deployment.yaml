---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-prototype-development-blue
  namespace: default
  labels:
    app: dd-prototype-development-blue
    deploy-id: dd-prototype-development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dd-prototype-development-blue
  template:
    metadata:
      labels:
        app: dd-prototype-development-blue
        deploy-id: dd-prototype-development
    spec:
      containers:
        - name: dd-prototype-development-blue
          image: underpost/underpost-engine:v3.4.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: underpost-config
            # The deployment's own environment, with its .env.<env>.oci overlay already
            # applied by 'app apply'. Optional so a deployment predating that Secret still
            # starts; the in-pod 'app load' resolves the same overlay as a second path.
            - secretRef:
                name: dd-prototype-development-env
                optional: true
          env:
            - name: UNDERPOST_INTERNAL_PORT
              value: "4025"

          command:
            - /bin/sh
            - -c
            - >
              underpost start --build --run dd-prototype development
          readinessProbe:
            {
              "httpGet": {
                "path": "/_internal/ready",
                "port": 4025
              },
              "initialDelaySeconds": 5,
              "periodSeconds": 5,
              "timeoutSeconds": 3,
              "failureThreshold": 3
            }
          livenessProbe:
            {
              "httpGet": {
                "path": "/_internal/health",
                "port": 4025
              },
              "initialDelaySeconds": 30,
              "periodSeconds": 15,
              "timeoutSeconds": 3,
              "failureThreshold": 3
            }
          startupProbe:
            {
              "httpGet": {
                "path": "/_internal/ready",
                "port": 4025
              },
              "initialDelaySeconds": 10,
              "periodSeconds": 10,
              "timeoutSeconds": 3,
              "failureThreshold": 180
            }



---
apiVersion: v1
kind: Service
metadata:
  name: dd-prototype-development-blue-service
  namespace: default
spec:
  selector:
    app: dd-prototype-development-blue
  ports:
    - name: 'tcp-4026'
      protocol: TCP
      port: 4026
      targetPort: 4026
    - name: 'udp-4026'
      protocol: UDP
      port: 4026
      targetPort: 4026

