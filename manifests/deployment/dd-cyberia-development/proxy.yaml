
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: underpost.net
  namespace: underpost-workloads
spec:
  virtualhost:
    fqdn: underpost.net
    tls:
      secretName: underpost.net
  routes:
    - conditions:
        - prefix: /
      
      enableWebsockets: true
      services:
        - name: dd-cyberia-development-traffic-service
          port: 4001
          weight: 100
    
    - conditions:
        - prefix: /peer
      
      enableWebsockets: true
      services:
        - name: dd-cyberia-development-traffic-service
          port: 4002
          weight: 100
    
