          namespace: underpost-platform
          port: 80
          weight: 100
    - matches:
        - path:
            type: PathPrefix
            value: /r1/peer
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Alt-Svc
                value: 'h3=":443"; ma=86400'
      backendRefs:
        - name: dd-test-development-traffic-service
          port: 4040
          weight: 100
    - matches:
        - path:
            type: PathPrefix
            value: /r2
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Alt-Svc
                value: 'h3=":443"; ma=86400'
      backendRefs:
        - name: dd-test-development-traffic-service
          port: 4041
          weight: 100
    - matches:
        - path:
            type: PathPrefix
