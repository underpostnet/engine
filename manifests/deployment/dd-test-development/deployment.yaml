    - name: 'udp-4043'
      protocol: UDP
      port: 4043
      targetPort: 4043

    - name: 'tcp-4044'
      protocol: TCP
      port: 4044
      targetPort: 4044
    - name: 'udp-4044'
      protocol: UDP
      port: 4044
      targetPort: 4044
  type: LoadBalancer
