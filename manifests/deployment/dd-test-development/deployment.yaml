---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-test-development-blue
  namespace: default
  labels:
    app: dd-test-development-blue
    deploy-id: dd-test-development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dd-test-development-blue
  template:
    metadata:
      labels:
        app: dd-test-development-blue
        deploy-id: dd-test-development
    spec:
      containers:
        - name: dd-test-development-blue
          image: underpost/underpost-engine:v3.4.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: underpost-config
            # The deployment's own environment, with its .env.<env>.oci overlay already
            # applied by 'app apply'. Optional so a deployment predating that Secret still
            # starts; the in-pod 'app load' resolves the same overlay as a second path.
            - secretRef:
                name: dd-test-development-env
                optional: true
          env:
            - name: UNDERPOST_INTERNAL_PORT
              value: "4035"

          command:
            - /bin/sh
            - -c
            - >
              underpost start --build --run dd-test development
          readinessProbe:
            {
              "httpGet": {
                "path": "/_internal/ready",
                "port": 4035
              },
              "initialDelaySeconds": 5,
              "periodSeconds": 5,
              "timeoutSeconds": 3,
              "failureThreshold": 3
            }
          livenessProbe:
            {
              "httpGet": {
                "path": "/_internal/health",
                "port": 4035
              },
              "initialDelaySeconds": 30,
              "periodSeconds": 15,
              "timeoutSeconds": 3,
              "failureThreshold": 3
            }
          startupProbe:
            {
              "httpGet": {
                "path": "/_internal/ready",
                "port": 4035
              },
              "initialDelaySeconds": 10,
              "periodSeconds": 10,
              "timeoutSeconds": 3,
              "failureThreshold": 180
            }



---
apiVersion: v1
kind: Service
metadata:
  name: dd-test-development-blue-service
  namespace: default
spec:
  selector:
    app: dd-test-development-blue
  ports:
    - name: 'tcp-4036'
      protocol: TCP
      port: 4036
      targetPort: 4036
    - name: 'udp-4036'
      protocol: UDP
      port: 4036
      targetPort: 4036

    - name: 'tcp-4037'
      protocol: TCP
      port: 4037
      targetPort: 4037
    - name: 'udp-4037'
      protocol: UDP
      port: 4037
      targetPort: 4037

    - name: 'tcp-4038'
      protocol: TCP
      port: 4038
      targetPort: 4038
    - name: 'udp-4038'
      protocol: UDP
      port: 4038
      targetPort: 4038

    - name: 'tcp-4039'
      protocol: TCP
      port: 4039
      targetPort: 4039
    - name: 'udp-4039'
      protocol: UDP
      port: 4039
      targetPort: 4039

    - name: 'tcp-4040'
      protocol: TCP
      port: 4040
      targetPort: 4040
    - name: 'udp-4040'
      protocol: UDP
      port: 4040
      targetPort: 4040

    - name: 'tcp-4041'
      protocol: TCP
      port: 4041
      targetPort: 4041
    - name: 'udp-4041'
      protocol: UDP
      port: 4041
      targetPort: 4041

    - name: 'tcp-4042'
      protocol: TCP
      port: 4042
      targetPort: 4042
    - name: 'udp-4042'
      protocol: UDP
      port: 4042
      targetPort: 4042

    - name: 'tcp-4043'
      protocol: TCP
      port: 4043
