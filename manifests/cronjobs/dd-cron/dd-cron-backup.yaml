apiVersion: batch/v1
kind: CronJob
metadata:
  name: dd-cron-backup
  namespace: default
  labels:
    app: dd-cron-backup
    managed-by: underpost
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 200
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  suspend: false
  jobTemplate:
    metadata:
      labels:
        app: dd-cron-backup
        managed-by: underpost
    spec:
      template:
        metadata:
          labels:
            app: dd-cron-backup
            managed-by: underpost
        spec:
          containers:
            - name: dd-cron-backup
              image: underpost/underpost-engine:v3.3.0
              command:
                - /bin/sh
                - -c
                - >
                  cd /home/dd/engine &&
                  node bin app load --env production --args deploy-id=dd-cron &&
                  node bin cron dd-lampp,dd-cyberia,dd-core,dd-prototype,dd-test backup --git --kubeadm 
              envFrom:
                - secretRef:
                    name: underpost-cron-env
                    optional: true
              volumeMounts:
                - mountPath: /home/dd/engine
                  name: underpost-cron-container-volume
                - mountPath: /var/lib/node_exporter/textfile
                  name: underpost-node-exporter-textfile
          volumes:
            # The engine checkout. The job body runs this repository's CLI (`node bin ...`), so it
            # needs the source tree, its node_modules and engine-private's deploy configuration —
            # the mount cannot be narrowed below the checkout without changing where the CLI runs
            # from. See docs/selinux-cron-mounts in the module header for the Enforcing caveat.
            - hostPath:
                path: /home/dd/engine
                type: Directory
              name: underpost-cron-container-volume
            # Metrics the cluster cannot scrape for itself are written here and read by the
            # node-exporter collector. Prepared and labeled by prepareCronHostStorage().
            - hostPath:
                path: /var/lib/node_exporter/textfile
                type: DirectoryOrCreate
              name: underpost-node-exporter-textfile
          restartPolicy: OnFailure
